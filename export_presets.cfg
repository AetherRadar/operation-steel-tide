[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="*_validation.png,*_validation.png.import,*_frame.png,*_frame.png.import,roof_access_*.png,roof_access_*.png.import,validation_frame.png,validation_frame.png.import,backend/data/*,build/*,dist/*,docs/*"
export_path="build/windows/OperationSteelTide.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc2=false
texture_format/etc2_astc=false
shader_baker/enabled=true
codesign/enable=false
application/modify_resources=true
application/icon="res://assets/branding/operation-steel-tide-icon.svg"
application/console_wrapper_icon="res://assets/branding/operation-steel-tide-icon.svg"
application/icon_interpolation=4
application/file_version="1.2.1"
application/product_version="1.2.1"
application/company_name="AetherRadar"
application/product_name="Operation Steel Tide"
application/file_description="Tactical extraction FPS prototype"
application/copyright="Copyright (c) 2026 AetherRadar"
application/trademarks=""
application/export_angle=0
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="#!/usr/bin/env bash\nexport DISPLAY=:0\nunzip -o -q \"{temp_dir}/{archive_name}\" -d \"{temp_dir}\"\n\"{temp_dir}/{exe_name}\" {cmd_args}"
ssh_remote_deploy/cleanup_script="#!/usr/bin/env bash\nkill $(pgrep -x -f \"{temp_dir}/{exe_name} {cmd_args}\")\nrm -rf \"{temp_dir}\""
