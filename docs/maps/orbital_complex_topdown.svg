<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1040" viewBox="0 0 1420 1040" role="img" aria-labelledby="title desc">
  <title id="title">Falltide Recovery Array extraction map top-down plan</title>
  <desc id="desc">A 340 by 320 metre offshore recovery facility with two objective districts, a central telemetry array and pressure-sensitive impact dock, the Cathode Well coolant cathedral, the Data Ossuary quarantine memory aisle, the Undertow Sump pump station, three vertical route layers, separated edge spawns, and a northern tide-gate extraction.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#52636b" stroke-width="1" opacity="0.22"/>
    </pattern>
    <pattern id="deck" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="12" height="12" fill="#283940"/>
      <path d="M0 0V12" stroke="#42545b" stroke-width="3" opacity="0.42"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="context-stroke"/>
    </marker>
    <style>
      .label{font-family:"Segoe UI",sans-serif;fill:#edf3f1}.small{font-family:"Segoe UI",sans-serif;fill:#b8c7c8;font-size:13px}.tiny{font-family:"Segoe UI",sans-serif;fill:#d5dfdf;font-size:11px}.mass{fill:#223037;stroke:#10181c;stroke-width:2}.poi{stroke-width:3}.route{fill:none;stroke-linecap:round;stroke-linejoin:round}.spawn{fill:#80d8c5;stroke:#d8fff4;stroke-width:2}.garrison{fill:#f1b25f}.loot{fill:#d79cff}.extract{fill:#47e6a0;stroke:#d3ffea;stroke-width:3}.objective{fill:#ffbd55;stroke:#fff1bb;stroke-width:3}
    </style>
  </defs>
  <rect width="1420" height="1040" fill="#0d1519"/>
  <text x="60" y="48" class="label" font-size="30" font-weight="700">FALLTIDE RECOVERY ARRAY</text>
  <text x="60" y="76" class="small">ORBITAL_COMPLEX · WORLD x[-170,170], z[-220,100] · NORTH = -Z · CONCEPT CONTRACT</text>

  <!-- 2 px/m. World north (-Z) is the top edge. -->
  <g transform="translate(60 120)">
    <rect x="0" y="0" width="680" height="640" fill="#19262c" stroke="#7c8d92" stroke-width="2"/>
    <rect x="0" y="0" width="680" height="640" fill="url(#grid)"/>

    <!-- Water and barrier crown. -->
    <path d="M0 0H680V640H0Z" fill="#16343e" opacity="0.45"/>
    <path d="M38 18H642L654 104L632 182L651 258L628 340L650 422L628 516L642 624H38L52 520L30 430L51 344L30 256L50 176L26 92Z" fill="url(#deck)" stroke="#516268" stroke-width="3"/>

    <!-- Main circulation: west/east deck, lower dock, upper earned bypass. -->
    <g class="route" stroke="#637980" stroke-width="34">
      <path d="M340 604C240 588 166 538 150 454S157 276 156 176S244 68 340 42"/>
      <path d="M340 604C440 588 514 538 530 454S523 276 524 176S436 68 340 42"/>
    </g>
    <path class="route" d="M340 602C328 516 352 451 340 374S333 228 340 132" stroke="#314b55" stroke-width="50"/>
    <path class="route" d="M177 362C248 312 277 244 340 224S446 260 506 344" stroke="#e8ae58" stroke-width="10" stroke-dasharray="16 11" opacity="0.86"/>

    <!-- Major authored masses and POIs. -->
    <g class="mass">
      <path d="M76 410L114 355L207 366L231 433L188 501L96 486Z"/>
      <path d="M449 376L554 350L612 407L591 492L494 505L441 447Z"/>
      <path d="M82 183L190 153L222 213L198 278L93 290L60 232Z"/>
      <path d="M464 170L584 155L622 225L585 298L474 282L444 220Z"/>
      <path d="M278 38H402L424 98L393 139H287L256 98Z"/>
      <path d="M274 519H406L423 610H257Z"/>
    </g>

    <!-- Second-pass interior signatures: the well frames the north spine and
         the ossuary folds into the east quarantine ring. -->
    <circle cx="340" cy="188" r="48" fill="#101f26" stroke="#63d6dc" stroke-width="3" stroke-dasharray="10 7"/>
    <circle cx="340" cy="188" r="30" fill="none" stroke="#e26a3d" stroke-width="5" opacity="0.82"/>
    <path d="M340 142V234M294 188H386" stroke="#8ce8ed" stroke-width="3" opacity="0.62"/>
    <circle cx="606" cy="188" r="42" fill="#18252f" stroke="#8bdff0" stroke-width="3" stroke-dasharray="7 6"/>
    <path d="M580 163L632 213M632 163L580 213" stroke="#ff7c4d" stroke-width="3" opacity="0.72"/>
    <path d="M104 504L116 492L128 504L116 516Z" fill="#1ab6c5" stroke="#b8ffff" stroke-width="3"/>

    <!-- Central dish and impact dock. -->
    <circle cx="340" cy="274" r="83" fill="#263d44" stroke="#75c6cf" stroke-width="4"/>
    <circle cx="340" cy="274" r="56" fill="none" stroke="#adc9cc" stroke-width="8"/>
    <path d="M314 251L369 226L383 272L332 302Z" fill="#d6ddd8" stroke="#eef8f3" stroke-width="2"/>
    <path d="M292 347H388L411 447H269Z" fill="#122b34" stroke="#4e7480" stroke-width="3"/>
    <ellipse cx="342" cy="404" rx="27" ry="17" fill="#c9d8d5" stroke="#79e2e5" stroke-width="4" transform="rotate(-18 342 404)"/>

    <!-- Objective and extraction markers. -->
    <circle class="objective" cx="151" cy="421" r="13"/>
    <circle class="objective" cx="531" cy="420" r="13"/>
    <circle class="extract" cx="340" cy="44" r="15"/>

    <!-- Spawn sectors. -->
    <g class="spawn">
      <circle cx="81" cy="563" r="8"/><circle cx="195" cy="611" r="8"/>
      <circle cx="485" cy="611" r="8"/><circle cx="599" cy="563" r="8"/>
      <circle cx="72" cy="118" r="8"/><circle cx="608" cy="118" r="8"/>
      <circle cx="42" cy="337" r="8"/><circle cx="638" cy="337" r="8"/>
    </g>

    <!-- Representative garrison and loot distribution. -->
    <g class="garrison">
      <circle cx="121" cy="391" r="4"/><circle cx="178" cy="455" r="4"/><circle cx="104" cy="222" r="4"/><circle cx="181" cy="237" r="4"/>
      <circle cx="499" cy="389" r="4"/><circle cx="564" cy="448" r="4"/><circle cx="502" cy="223" r="4"/><circle cx="571" cy="254" r="4"/>
      <circle cx="299" cy="282" r="4"/><circle cx="384" cy="281" r="4"/><circle cx="321" cy="365" r="4"/><circle cx="378" cy="383" r="4"/>
    </g>
    <g class="loot">
      <rect x="143" y="413" width="8" height="8"/><rect x="529" y="412" width="8" height="8"/>
      <rect x="336" y="399" width="10" height="10"/><rect x="102" y="470" width="7" height="7"/><rect x="573" y="472" width="7" height="7"/>
      <rect x="94" y="209" width="7" height="7"/><rect x="576" y="210" width="7" height="7"/>
    </g>

    <!-- Route arrows. -->
    <g class="route" stroke-width="4" marker-end="url(#arrow)">
      <path d="M195 590C160 545 139 504 146 456" stroke="#82d8c4"/>
      <path d="M485 590C524 543 539 500 531 454" stroke="#82d8c4"/>
      <path d="M151 405C229 355 270 319 300 299" stroke="#f1b35f"/>
      <path d="M531 405C456 351 411 321 380 300" stroke="#f1b35f"/>
      <path d="M340 349C335 279 340 194 340 70" stroke="#55dba0"/>
    </g>

    <g class="label" text-anchor="middle">
      <text x="340" y="28" font-size="16" font-weight="700">TIDE GATE · EXTRACT</text>
      <text x="340" y="159" font-size="14">STORMGLASS ARRAY</text>
      <text x="340" y="130" font-size="12">CATHODE WELL · COOLANT CATHEDRAL</text>
      <text x="606" y="136" font-size="12">DATA OSSUARY · MEMORY AISLE</text>
      <text x="116" y="536" font-size="12">UNDERTOW SUMP · MANUAL PURGE</text>
      <text x="340" y="439" font-size="13">IMPACT DRYDOCK</text>
      <text x="151" y="521" font-size="15" font-weight="700">BREAKER YARD</text>
      <text x="531" y="521" font-size="15" font-weight="700">QUARANTINE ARCHIVE</text>
      <text x="140" y="142" font-size="13">SALVAGE BASIN</text>
      <text x="540" y="142" font-size="13">CUSTODY ANNEX</text>
      <text x="340" y="629" font-size="15" font-weight="700">INTAKE CAUSEWAY</text>
    </g>
  </g>

  <g transform="translate(790 126)">
    <text class="label" x="0" y="0" font-size="23" font-weight="700">ROUND-SPECIFIC VERB</text>
    <text class="small" x="0" y="30">Reroute the storm grid. Power changes routes, rewards,</text>
    <text class="small" x="0" y="51">AI pressure, lighting, vault access, and extraction readiness.</text>

    <text class="label" x="0" y="105" font-size="20" font-weight="700">POWER STAGES</text>
    <rect x="0" y="126" width="500" height="90" rx="8" fill="#172127" stroke="#516168"/>
    <circle cx="28" cy="152" r="10" fill="#4d6f77"/><text class="small" x="49" y="157">0 · BLACKOUT — low routes, sealed vault, no extract</text>
    <circle cx="28" cy="177" r="10" fill="#e6a955"/><text class="small" x="49" y="182">1 · EMERGENCY — upper bypass, long public extract</text>
    <circle cx="28" cy="202" r="10" fill="#e4574f"/><text class="small" x="49" y="207">2 · FULL REROUTE — vault, boss/QRF, faster extract</text>

    <text class="label" x="0" y="273" font-size="20" font-weight="700">RISK TIERS</text>
    <rect x="0" y="294" width="500" height="92" rx="8" fill="#172127" stroke="#516168"/>
    <rect x="18" y="311" width="18" height="18" fill="#6fa58e"/><text class="small" x="49" y="325">Outer ring · common / uncommon · early weapons</text>
    <rect x="18" y="337" width="18" height="18" fill="#bf8ad9"/><text class="small" x="49" y="351">Objective districts · rare / epic · public interaction</text>
    <rect x="18" y="363" width="18" height="18" fill="#f2cc64"/><text class="small" x="49" y="377">Capsule core · legendary · optional full-power gamble</text>

    <text class="label" x="0" y="443" font-size="20" font-weight="700">MAP LEGEND</text>
    <circle class="spawn" cx="18" cy="472" r="8"/><text class="small" x="41" y="477">candidate squad spawn</text>
    <circle class="objective" cx="18" cy="500" r="8"/><text class="small" x="41" y="505">storm-grid objective</text>
    <circle class="garrison" cx="18" cy="528" r="5"/><text class="small" x="41" y="533">representative garrison post</text>
    <rect class="loot" x="12" y="548" width="12" height="12"/><text class="small" x="41" y="559">representative graded loot</text>
    <path d="M10 588H70" stroke="#e8ae58" stroke-width="8" stroke-dasharray="13 9"/><text class="small" x="84" y="593">upper bypass (opens at stage 1)</text>
    <path d="M10 620H70" stroke="#314b55" stroke-width="20"/><text class="small" x="84" y="625">drained dock / low route</text>
    <path d="M10 652L22 640L34 652L22 664Z" fill="#1ab6c5" stroke="#b8ffff" stroke-width="2"/><text class="small" x="49" y="657">optional Undertow pressure purge</text>

    <text class="label" x="0" y="684" font-size="20" font-weight="700">COMPETITIVE RULES</text>
    <text class="small" x="0" y="714">• seed fixes objective order and all static entity order</text>
    <text class="small" x="0" y="739">• each spawn gets an early weapon decision before contact</text>
    <text class="small" x="0" y="764">• no post observes every entrance to a major district</text>
    <text class="small" x="0" y="789">• central legendary loot is optional, never required to leave</text>
    <text class="small" x="0" y="814">• three final approaches converge visibly on the Tide Gate</text>
    <text class="small" x="0" y="839">• Undertow purge clears the lower dock without skipping objectives</text>
  </g>
</svg>
