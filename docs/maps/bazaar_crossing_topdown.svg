<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Bazaar Crossing demolition map top-down plan</title>
  <desc id="desc">A 136 by 112 metre three-lane demolition map with ground-level sites A and B, a west long lane, central crossroads, an east banana lane, and three upper decks with two stair accesses each.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#34434a" stroke-width="1" opacity="0.4"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#b9c5c8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="#10181c"/>
  <text x="56" y="58" fill="#f4f0df" font-family="Segoe UI, sans-serif" font-size="30" font-weight="600">BAZAAR CROSSING</text>
  <text x="56" y="86" fill="#92a4aa" font-family="Segoe UI, sans-serif" font-size="16">5v5 DEMOLITION · 136 × 112 m · NORTH ↑</text>

  <g transform="translate(64 112)">
    <rect x="0" y="0" width="816" height="672" fill="#182429" stroke="#62747a" stroke-width="2"/>
    <rect x="0" y="0" width="816" height="672" fill="url(#grid)"/>

    <g fill="#2b383d" stroke="#59696e" stroke-width="1.5">
      <path d="M0 0H216V82H126V198H44V348H0Z"/>
      <path d="M278 0H538V92H470V214H346V112H278Z"/>
      <path d="M602 0H816V356H766V228H690V102H602Z"/>
      <path d="M78 260H262V358H218V446H86Z"/>
      <path d="M318 276H498V382H458V454H362V382H318Z"/>
      <path d="M550 270H714V360H706V450H610V384H550Z"/>
      <path d="M0 484H244V554H308V672H0Z"/>
      <path d="M510 486H816V672H510V574H458V516Z"/>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
      <path d="M408 630L300 584L190 554L116 500L102 430L118 358L92 298L120 210L150 132" stroke="#e88a39" stroke-width="10"/>
      <path d="M408 630V566V500L386 432L430 374L408 310V244L350 170L264 132M408 244L466 170L552 132" stroke="#58bdb6" stroke-width="10"/>
      <path d="M408 630L516 588L626 554L700 502L710 446L686 384L718 326L692 264L680 198L666 132" stroke="#50a9dc" stroke-width="10"/>
      <path d="M150 132L264 132L350 170L466 170L552 132L666 132M264 132V72H552V132" stroke="#b9c5c8" stroke-width="4" stroke-dasharray="10 9"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="116" y="98" width="68" height="68" rx="6" fill="#b65724" stroke="#ffb15d" stroke-width="3"/>
      <rect x="632" y="98" width="68" height="68" rx="6" fill="#1f6a88" stroke="#6ed2ff" stroke-width="3"/>
      <text x="150" y="141" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">A</text>
      <text x="666" y="141" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">B</text>
      <circle cx="408" cy="630" r="22" fill="#26383d" stroke="#f4f0df" stroke-width="3"/>
      <circle cx="408" cy="38" r="22" fill="#26383d" stroke="#f4f0df" stroke-width="3"/>
      <text x="408" y="636" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="16">ATK</text>
      <text x="408" y="44" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="16">DEF</text>
    </g>

    <g fill="#6a5a25" fill-opacity="0.82" stroke="#ffd35c" stroke-width="3" filter="url(#shadow)">
      <rect x="186" y="180" width="116" height="34"/>
      <rect x="350" y="250" width="116" height="32"/>
      <rect x="526" y="184" width="112" height="34"/>
    </g>
    <g fill="none" stroke="#ffd35c" stroke-width="8">
      <path d="M186 197L152 228M302 197L334 230"/>
      <path d="M368 282L338 324M448 282L478 324"/>
      <path d="M526 201L494 232M638 201L670 234"/>
    </g>
    <g fill="#fff4c4" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="middle">
      <text x="244" y="203">A GALLERY +3.0 m</text>
      <text x="408" y="272">MID BRIDGE +3.0 m</text>
      <text x="582" y="207">B BALCONY +2.6 m</text>
    </g>

    <g fill="none" stroke="#ff6961" stroke-width="3" stroke-dasharray="7 6">
      <path d="M322 506H494"/>
      <path d="M72 404L166 386"/>
      <path d="M650 398L746 378"/>
      <path d="M314 222H502"/>
    </g>
    <g fill="#d4dcde" font-family="Segoe UI, sans-serif" font-size="16">
      <text x="64" y="474" transform="rotate(-90 64 474)">A LONG · TWO SIGHTLINE KINKS</text>
      <text x="428" y="470" text-anchor="middle">CROSSROADS · INFO / ROTATION</text>
      <text x="752" y="470" transform="rotate(90 752 470)">B BANANA · S BENDS</text>
    </g>
  </g>

  <g transform="translate(920 132)" font-family="Segoe UI, sans-serif">
    <text x="0" y="0" fill="#f4f0df" font-size="21" font-weight="600">READING THE PLAN</text>
    <line x1="0" y1="38" x2="48" y2="38" stroke="#e88a39" stroke-width="8" stroke-linecap="round"/><text x="64" y="44" fill="#d4dcde" font-size="16">A route</text>
    <line x1="0" y1="78" x2="48" y2="78" stroke="#58bdb6" stroke-width="8" stroke-linecap="round"/><text x="64" y="84" fill="#d4dcde" font-size="16">Mid route</text>
    <line x1="0" y1="118" x2="48" y2="118" stroke="#50a9dc" stroke-width="8" stroke-linecap="round"/><text x="64" y="124" fill="#d4dcde" font-size="16">B route</text>
    <line x1="0" y1="158" x2="48" y2="158" stroke="#b9c5c8" stroke-width="4" stroke-dasharray="9 7"/><text x="64" y="164" fill="#d4dcde" font-size="16">Rotation</text>
    <rect x="0" y="190" width="48" height="22" fill="#6a5a25" stroke="#ffd35c" stroke-width="2"/><text x="64" y="208" fill="#d4dcde" font-size="16">Upper deck</text>
    <line x1="0" y1="246" x2="48" y2="246" stroke="#ff6961" stroke-width="3" stroke-dasharray="7 6"/><text x="64" y="252" fill="#d4dcde" font-size="16">Hard LOS break</text>

    <text x="0" y="314" fill="#f4f0df" font-size="21" font-weight="600">VERTICAL RULES</text>
    <text x="0" y="348" fill="#d4dcde" font-size="15">• 3 optional upper routes</text>
    <text x="0" y="378" fill="#d4dcde" font-size="15">• 2 exits per upper route</text>
    <text x="0" y="408" fill="#d4dcde" font-size="15">• ≥ 2.8 m clear width</text>
    <text x="0" y="438" fill="#d4dcde" font-size="15">• ≤ 18° ramp grade</text>
    <text x="0" y="468" fill="#d4dcde" font-size="15">• Sites stay at street level</text>
    <text x="0" y="498" fill="#d4dcde" font-size="15">• No deck sees both sites</text>

    <text x="0" y="562" fill="#f4f0df" font-size="21" font-weight="600">ROUND RHYTHM</text>
    <text x="0" y="596" fill="#d4dcde" font-size="15">ATK main route: 100–110 m</text>
    <text x="0" y="626" fill="#d4dcde" font-size="15">DEF setup edge: 1–3 s</text>
    <text x="0" y="656" fill="#d4dcde" font-size="15">Back rotation: 80–100 m</text>
  </g>

  <line x1="64" y1="826" x2="880" y2="826" stroke="#73858a" stroke-width="1"/>
  <line x1="64" y1="826" x2="160" y2="826" stroke="#f4f0df" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="64" y="854" fill="#92a4aa" font-family="Segoe UI, sans-serif" font-size="14">16 m grid · schematic gameplay blueprint · final collision and authored art verified in Godot</text>
</svg>
